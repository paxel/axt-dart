# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_axt-dart
# Analysed by .github/workflows/ci.yml (sonar.yml) on every pull request and on summer; Automatic Analysis is off.
sonar.organization=paxel
sonar.projectKey=paxel_axt-dart
sonar.projectName=axt-dart

sonar.sources=lib,.github/workflows
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Coverage: dart.yml keeps the LCOV file of each part here.
sonar.dart.lcov.reportPaths=coverage/dart.lcov
